name: Deploy Azure demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-demo-deployment
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Build solution
        run: dotnet build OctocatSupply.slnx --configuration Release

      - name: Run tests
        run: dotnet test --configuration Release --no-build --no-restore --verbosity minimal

  deploy:
    name: Provision and deploy
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 120
    environment:
      name: azure-demo
      url: ${{ steps.deploy.outputs.frontend_url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        shell: pwsh
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $required = @('AZURE_RESOURCE_GROUP', 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "Missing GitHub environment variables or secrets: $($missing -join ', '). See docs/deployment.md."
          }

      - name: Sign in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision resources and deploy containers
        id: deploy
        shell: pwsh
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
          AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME || 'octocat-supply' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $imageTag = "$($env:GITHUB_SHA)-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $deployment = & .\infra\deploy.ps1 `
            -ResourceGroup $env:AZURE_RESOURCE_GROUP `
            -Location $env:AZURE_LOCATION `
            -AppName $env:AZURE_APP_NAME `
            -ImageTag $imageTag

          "frontend_url=$($deployment.FrontendUrl)" >> $env:GITHUB_OUTPUT
          @(
            '## Azure demo deployed'
            ''
            "- Frontend: [$($deployment.FrontendUrl)]($($deployment.FrontendUrl))"
            "- Container app: $($deployment.ContainerAppName)"
            "- Registry: $($deployment.RegistryName)"
            "- Image tag: $($deployment.ImageTag)"
            "- Resource group: $env:AZURE_RESOURCE_GROUP"
            '- SQLite data and browser sessions are disposable.'
          ) >> $env:GITHUB_STEP_SUMMARY
